# LangBot deployment for Coolify.
#
# Derived from langbot-app/LangBot docker/docker-compose.yaml. Two changes:
#  - volume sources are literal paths, not ${...}: Coolify rejects variable
#    substitution in volume sources as a command-injection risk.
#  - the Box root host path and in-container path are identical (/data/langbot-box),
#    which the Box runtime requires because it mounts the host Docker socket.
#
# Secrets live in Coolify env vars, never in this file:
#   LANGBOT_PLUGIN_RUNTIME_CONTROL_TOKEN, LANGBOT_BOX_CONTROL_TOKEN
services:
  langbot_plugin_runtime:
    image: rockchin/langbot:latest
    restart: unless-stopped
    volumes:
      - ./data/plugins:/app/data/plugins
    environment:
      - TZ=Europe/Madrid
      - LANGBOT_PLUGIN_RUNTIME_CONTROL_TOKEN=${LANGBOT_PLUGIN_RUNTIME_CONTROL_TOKEN:-}
    command: ["uv", "run", "--no-sync", "-m", "langbot_plugin.cli.__init__", "rt"]
    networks:
      - langbot_network

  # Box sandbox runtime. NOT published to the host on purpose: port 5410 stays
  # inside this bridge network. It does mount the host Docker socket, which is
  # why nothing else on this network should be untrusted.
  langbot_box:
    image: rockchin/langbot:latest
    restart: unless-stopped
    volumes:
      - /data/langbot-box:/data/langbot-box
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid
      - LANGBOT_BOX_CONTROL_TOKEN=${LANGBOT_BOX_CONTROL_TOKEN:-}
    command: ["uv", "run", "--no-sync", "-m", "langbot_plugin.cli.__init__", "box"]
    networks:
      - langbot_network

  langbot:
    image: rockchin/langbot:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Madrid
      - LANGBOT_PLUGIN_RUNTIME_CONTROL_TOKEN=${LANGBOT_PLUGIN_RUNTIME_CONTROL_TOKEN:-}
      - LANGBOT_BOX_CONTROL_TOKEN=${LANGBOT_BOX_CONTROL_TOKEN:-}
      # data/config.yaml persists box.enabled from previous runs, so pin it
      # here or Box stays off even with langbot_box running.
      - BOX__ENABLED=true
      - BOX__LOCAL__HOST_ROOT=/data/langbot-box
      - BOX__LOCAL__DEFAULT_WORKSPACE=default
      - BOX__LOCAL__SKILLS_ROOT=skills
      - BOX__LOCAL__ALLOWED_MOUNT_ROOTS=/data/langbot-box
      - BOX__DOCKER__CPU_LIMIT_ENABLED=true
    ports:
      - 5300:5300
      - 2280-2285:2280-2285
    networks:
      - langbot_network

networks:
  langbot_network:
    driver: bridge
